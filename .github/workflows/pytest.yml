name: ci

on:
  push:
  pull_request:


jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project with development dependencies
        run: pip install -c constraints.txt -e '.[dev]'
      - name: Run test suite
        run: python -m pytest

  wheel-gate:
    name: Wheel build and install gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install package build tool
        run: python -m pip install build
      - name: Build distributions
        run: python -m build
      - name: Validate wheel archive
        run: |
          python - <<'PY'
          from collections import Counter
          from pathlib import Path
          import zipfile

          wheels = sorted(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected exactly one wheel, found {len(wheels)}")

          with zipfile.ZipFile(wheels[0]) as archive:
              names = archive.namelist()

          duplicates = sorted(name for name, count in Counter(names).items() if count > 1)
          if duplicates:
              raise SystemExit(f"duplicate wheel entries: {duplicates}")

          skill_doc = "agent_reach/skill/SKILL.md"
          if skill_doc not in names:
              raise SystemExit(f"missing skill documentation: {skill_doc}")

          resource_prefixes = {
              "guide": "agent_reach/guides/",
              "helper script": "agent_reach/scripts/",
              "skill reference": "agent_reach/skill/references/",
          }
          for label, prefix in resource_prefixes.items():
              matches = sorted(
                  name
                  for name in names
                  if name.startswith(prefix) and not name.endswith("/")
              )
              if not matches:
                  raise SystemExit(f"missing {label} resource under {prefix}")
              print(f"{label}: {matches[0]}")

          print(f"validated wheel: {wheels[0]}")
          PY
      - name: Install wheel into clean virtual environment
        run: |
          python -m venv "${RUNNER_TEMP}/agent-reach-wheel-venv"
          "${RUNNER_TEMP}/agent-reach-wheel-venv/bin/python" -m pip install dist/*.whl
      - name: Verify installed CLI entrypoint
        run: |
          "${RUNNER_TEMP}/agent-reach-wheel-venv/bin/agent-reach" --version
      - name: Verify installed package resources outside repository
        working-directory: ${{ runner.temp }}
        run: |
          "${RUNNER_TEMP}/agent-reach-wheel-venv/bin/python" - <<'PY'
          import importlib.resources

          import agent_reach

          skill_doc = (
              importlib.resources.files("agent_reach")
              .joinpath("skill")
              .joinpath("SKILL.md")
          )
          if not skill_doc.is_file():
              raise SystemExit(f"installed skill documentation is not a file: {skill_doc}")

          content = skill_doc.read_text(encoding="utf-8")
          if not content.strip():
              raise SystemExit("installed skill documentation is empty")

          print(f"imported {agent_reach.__version__} from {agent_reach.__file__}")
          print(f"verified package resource file: {skill_doc}")
          PY
